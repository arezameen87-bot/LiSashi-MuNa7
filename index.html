<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Particles</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let particles = [];
let frame = 0;

const BLUE = [
    "#008cff",
    "#00bfff",
    "#468cff",
    "#006eff"
];

const GOLD = [
    "#ffd700",
    "#ffcc33",
    "#fff09a",
    "#f5b800"
];


// ============================
// RESIZE
// ============================

function resize() {

    const dpr = window.devicePixelRatio || 1;

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createHeart();
}

window.addEventListener("resize", resize);


// ============================
// HEART EQUATION
// ============================

function heart(t) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: -y
    };
}


// ============================
// PARTICLE
// ============================

class Particle {

    constructor(targetX, targetY, delay) {

        // Start at center
        this.x = W / 2;
        this.y = H / 2;

        this.targetX = targetX;
        this.targetY = targetY;

        this.delay = delay;

        this.alpha = 0;

        this.size =
            Math.random() * 2.5 + 1.2;

        this.color =
            Math.random() < 0.55
            ? BLUE[Math.floor(Math.random() * BLUE.length)]
            : GOLD[Math.floor(Math.random() * GOLD.length)];

        this.phase =
            Math.random() * Math.PI * 2;

        this.speed =
            0.025 + Math.random() * 0.035;

        this.randomX =
            (Math.random() - 0.5) * 80;

        this.randomY =
            (Math.random() - 0.5) * 80;
    }


    update() {

        if (frame < this.delay)
            return;


        // Fade in
        this.alpha += 0.035;

        if (this.alpha > 1)
            this.alpha = 1;


        // Move toward heart
        const dx =
            this.targetX - this.x;

        const dy =
            this.targetY - this.y;


        this.x += dx * this.speed;
        this.y += dy * this.speed;
    }


    draw() {

        if (frame < this.delay)
            return;


        // Flickering glow
        const flicker =
            0.75 +
            Math.sin(
                frame * 0.06 +
                this.phase
            ) * 0.25;


        const alpha =
            this.alpha * flicker;


        ctx.save();

        ctx.globalAlpha = alpha;

        // Glow
        ctx.shadowBlur = 18;
        ctx.shadowColor = this.color;

        ctx.fillStyle = this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fill();


        // Bright center
        ctx.shadowBlur = 5;

        ctx.fillStyle = "#ffffff";

        ctx.globalAlpha =
            alpha * 0.7;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size * 0.35,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


// ============================
// CREATE HEART
// ============================

function createHeart() {

    particles = [];

    const scale =
        Math.min(W, H) / 34;


    // ----------------------------
    // HEART OUTLINE
    // ----------------------------

    const outline = 300;

    for (let i = 0; i < outline; i++) {

        const t =
            (i / outline) *
            Math.PI * 2;

        const h = heart(t);

        const x =
            W / 2 +
            h.x * scale;

        const y =
            H / 2 +
            h.y * scale;


        particles.push(
            new Particle(
                x,
                y,
                i * 1.8
            )
        );
    }


    // ----------------------------
    // HEART INSIDE
    // ----------------------------

    const inside = 220;

    for (let i = 0; i < inside; i++) {

        const t =
            Math.random() *
            Math.PI * 2;

        const r =
            Math.sqrt(Math.random()) *
            0.85;

        const h = heart(t);

        const x =
            W / 2 +
            h.x * scale * r;

        const y =
            H / 2 +
            h.y * scale * r;


        particles.push(
            new Particle(
                x,
                y,
                500 + Math.random() * 450
            )
        );
    }
}


// ============================
// ANIMATION
// ============================

function animate() {

    frame++;


    // Black background
    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // Particles
    for (const particle of particles) {

        particle.update();

        particle.draw();

    }


    requestAnimationFrame(animate);
}


// ============================
// START
// ============================

resize();
animate();

</script>

</body>
</html>
