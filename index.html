<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.center {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    color: #fffaf5;
    font-family: Georgia, serif;
    font-size: clamp(35px, 6vw, 75px);
    font-weight: bold;
    white-space: nowrap;
    opacity: 0;
    text-shadow:
        0 0 8px white,
        0 0 20px #4aa3ff,
        0 0 40px #168cff;
    transition: opacity 2s ease, transform 2s ease;
    pointer-events: none;
}

.center.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="center" id="centerText">
    Love You
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const centerText = document.getElementById("centerText");

let W, H;
let particles = [];
let frame = 0;

const words = [
    "love you",
    "Love You",
    "LOVE YOU"
];

const colors = [
    "#4682B4",
    "#1E90FF",
    "#00BFFF",
    "#6495ED",
    "#4169E1"
];

function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    createParticles();
}

window.addEventListener("resize", resize);


// HEART EQUATION
function heart(t) {

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: -y
    };
}


// PARTICLE
class Particle {

    constructor(x, y, delay, size) {

        this.targetX = x;
        this.targetY = y;

        this.x = window.innerWidth / 2;
        this.y = window.innerHeight / 2;

        this.delay = delay;

        this.alpha = 0;
        this.size = size;

        this.word =
            words[Math.floor(Math.random() * words.length)];

        this.color =
            colors[Math.floor(Math.random() * colors.length)];

        this.angle = Math.random() * Math.PI * 2;

        this.flicker =
            Math.random() * Math.PI * 2;

        this.speed =
            0.02 + Math.random() * 0.03;
    }


    update() {

        if (frame < this.delay) {
            return;
        }

        // Move toward heart position
        this.x += (this.targetX - this.x) * 0.045;
        this.y += (this.targetY - this.y) * 0.045;

        // Fade in
        this.alpha += 0.035;

        if (this.alpha > 1)
            this.alpha = 1;
    }


    draw() {

        if (frame < this.delay)
            return;

        const flicker =
            0.75 +
            Math.sin(frame * 0.05 + this.flicker) * 0.25;

        const alpha =
            Math.min(1, this.alpha) * flicker;

        ctx.save();

        ctx.globalAlpha = alpha;

        ctx.font =
            `bold ${this.size}px Arial`;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // BIG GLOW
        ctx.shadowBlur = 25;
        ctx.shadowColor = this.color;

        ctx.fillStyle = this.color;

        ctx.fillText(
            this.word,
            this.x,
            this.y
        );

        // SMALLER BRIGHT GLOW
        ctx.shadowBlur = 8;

        ctx.fillStyle = "#bde7ff";

        ctx.fillText(
            this.word,
            this.x,
            this.y
        );

        ctx.restore();
    }
}


// CREATE HEART PARTICLES
function createParticles() {

    particles = [];

    const scale =
        Math.min(
            window.innerWidth,
            window.innerHeight
        ) / 32;

    // OUTLINE
    const outlineCount = 150;

    for (let i = 0; i < outlineCount; i++) {

        const t =
            (i / outlineCount) *
            Math.PI * 2;

        const h = heart(t);

        const x =
            window.innerWidth / 2 +
            h.x * scale;

        const y =
            window.innerHeight / 2 +
            h.y * scale;

        particles.push(
            new Particle(
                x,
                y,
                i * 2,
                12 + Math.random() * 5
            )
        );
    }


    // FILL
    const fillCount = 130;

    for (let i = 0; i < fillCount; i++) {

        const t =
            Math.random() *
            Math.PI * 2;

        const r =
            Math.random() * 0.85;

        const h = heart(t);

        const x =
            window.innerWidth / 2 +
            h.x * scale * r;

        const y =
            window.innerHeight / 2 +
            h.y * scale * r;

        particles.push(
            new Particle(
                x,
                y,
                350 + Math.random() * 300,
                10 + Math.random() * 5
            )
        );
    }
}


// ANIMATION
function animate() {

    frame++;

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    // Black background
    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    // Update + draw particles
    for (const particle of particles) {

        particle.update();
        particle.draw();

    }


    // Show center text after animation
    if (frame > 1000) {

        centerText.classList.add("show");

    }


    requestAnimationFrame(animate);
}


// START
resize();
animate();

</script>

</body>
</html>
